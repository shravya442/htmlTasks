<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <table cellspacing="20" align="center">
        <tr>
            <td>
                <table border="1" align="center" height="20" width="320" cellpadding="5">
                     
                            <th align="center">Login Form<br><hr width="150"/>
                    
                   
                       
                            
                            <table border="1" cellspacing="0" height="20" width="290">
                                <tr align="center">
                                    <td><label>Username:</label>
                                    <input type="text" name="Username"><br/></td>
                                </tr>
                                <tr align="center">
                                    <td><label>Password:</label>
                                    <input type="password" name="Password"></td>
                                </tr>
                                
                            </table>
                            <p align="left"><input type="checkbox" align="left">Remember Me:<hr width="250"/></p>
                            
                            <input type="submit" value="login">
                            <input type="submit" value="reset">
                        
                    
                </table>
            </td>
            <td>
                <!-- width=250 -->
            </td>
            <td>
                <table border="0" frame="box" cellpadding="10">
                    <tr>
                        <th align="center">Event Registration<br><hr width="150"/>
                        <table border="1">
                            <tr>
                                <td>Name:</td>
                                <td><input type="text" name="name"></td>
                            </tr>
                            <tr>
                                <td>Email:</td>
                                <td><input type="text" name="Email"></td>
                            </tr>
                            <tr>
                                <td>Select Event:</td>
                                <td>
                                    <select>
                                        <option>Conference</option>
                                        <option>Workshop</option>
                                        <option>Seminar</option>
                                    </select>
                                    
                                </td>
                            </tr>
                            
                        </table>
                        <p><input type="submit" value="Register">
                        <input type="submit" value="cancel"></p>
                        <td>
                            <img src="https://tse3.mm.bing.net/th/id/OIP.2j3J3J0HwSdsMQB57je_vQHaH_?pid=Api&P=0&h=180" height="100" width="100">
                        </td>
                    </tr>
                    
                </table>
            </td>
        </tr>
        <tr>
            <td>
                <table border="1" height="20" width="300">
                    <th align="center">Survey Form<br><hr width="150"/>
                    <table border="1" height="20" width="250">
                        <tr>
                            <td>
                                How satisfied are you?
                            </td>
                        </tr>
                        <tr>
                            <td>
                                <input type="radio">Very satisfied<br>
                                <input type="radio">Neutral<br>
                                <input type="radio">dissatisfied
                            </td>
                        </tr>
                    </table>
                    <table border="1" height="20" width="250">
                        <tr>
                            <td>Comments:<br/><textarea rows="2" cols="30"></textarea></td>
                        </tr>
                    </table>
                    <p><input type="submit" value="Submit">
                    <input type="submit" value="clear"></p>
                </table>
            </td>
            <td>
                <table border="1" cellpadding="10">
                    <th align="center">Hotel Booking<br><hr width="150"/>
                    <img src="https://tse2.mm.bing.net/th/id/OIP.3UBS04fr_OSIA5930qV8cwHaEo?pid=Api&P=0&h=180" height="100" width="300">
                    <table border="1">
                        <tr>
                            <td><label>Check-in Date:</label><input type="text"></td>
                        </tr>
                        <tr>
                            <td><label>Check-out Date:</label><input type="text"></td>
                        </tr>
                        <tr>
                            <td><label>Number of Guests:</label><select width="">
                                <option></option>
                            </select></td>
                        </tr>

                    </table>
                    <p><input type="submit" value="Book Now">
                    <input type="submit" value="cancel"></p>
                </table>
            </td>
            <td>
                <table border="1" height="20" width="320" cellpadding="1">
                    <th align="center">Job Application<br><hr width="150"/>
                    <table border="1" align="center">
                        <tr>
                            <td align="center">
                                <label>Full Name:</label> <input type="text">
                               
                            </td>
                        </tr>
                        <tr>
                            <td align="center">
                                <label>Position Applied:</label>
                                <input type="text">
                            </td>
                        </tr>
                    </table>
                    <tr>
                        <td>
                            <dl>
                                <dt>Qualifications:</dt>
                            </dl>
                            <ol type="1">
                                <li>Resume Upload</li>
                                <li>Cover Letter</li>
                                <li>References</li>
                            </ol><hr width="290"/>
                            <p align="center"><input type="submit" value="Apply">
                            <input type="submit" value="Reset"></p>
                        </td>
                    

                    </tr>
    

                </table>
            </td>
        </tr>
    </table>

</html>
